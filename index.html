<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Багер 16 т</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#172028;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif
}

#cv{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#87bfe4
}

.hud{
  position:fixed;
  top:max(8px,env(safe-area-inset-top));
  left:8px;
  right:8px;
  display:flex;
  gap:5px;
  z-index:5;
  pointer-events:none
}

.h{
  flex:1;
  background:#111b22cc;
  border:1px solid #ffffff2e;
  border-radius:9px;
  padding:5px;
  color:#aeb8c0;
  font-size:8px;
  font-weight:800
}

.h b{
  display:block;
  color:#ffc83d;
  font:700 14px ui-monospace,monospace;
  margin-top:2px
}

.joy{
  position:fixed;
  bottom:max(12px,env(safe-area-inset-bottom));
  width:132px;
  height:132px;
  border-radius:50%;
  background:#111a22aa;
  border:2px solid #ffffff33;
  z-index:10
}

.left{left:12px}
.right{right:12px}

.knob{
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  margin:-29px;
  border-radius:50%;
  background:#566575;
  border:2px solid #9ca8b5;
  transform:translate3d(0,0,0)
}

.knob.on{
  background:#e5a21b;
  border-color:#ffc83d
}

.lab{
  position:absolute;
  color:#fff;
  font-size:8px;
  font-weight:900
}

.u{
  top:6px;
  left:50%;
  transform:translateX(-50%)
}

.d{
  bottom:6px;
  left:50%;
  transform:translateX(-50%)
}

.l{
  left:6px;
  top:50%
}

.r{
  right:6px;
  top:50%
}

#drive{
  position:fixed;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:68px;
  height:105px;
  background:#111a22aa;
  border:2px solid #ffffff33;
  border-radius:10px;
  z-index:10
}

#dk{
  position:absolute;
  left:7px;
  top:39px;
  width:50px;
  height:26px;
  border-radius:6px;
  background:#566575;
  border:2px solid #7d8995
}

#start{
  position:fixed;
  inset:0;
  z-index:30;
  background:#10161bef;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  color:white
}

#start button{
  font-size:22px;
  font-weight:900;
  padding:16px 28px;
  border:0;
  border-radius:14px;
  background:#ffc83d
}

.run #start{display:none}
</style>
</head>

<body>

<canvas id="cv"></canvas>

<div class="hud">
  <div class="h">КОФА<b id="hb">0%</b></div>
  <div class="h">КАМИОН<b id="ht">0%</b></div>
  <div class="h">МОТОЧАС<b id="hh">0.0</b></div>
  <div class="h">ДИЗЕЛ<b id="hf">100%</b></div>
</div>

<div class="joy left" id="jl">
  <span class="lab u">РЪКОХ.</span>
  <span class="lab d">НАВЪТРЕ</span>
  <span class="lab l">◀</span>
  <span class="lab r">▶</span>
  <div class="knob" id="kl"></div>
</div>

<div class="joy right" id="jr">
  <span class="lab u">СТРЕЛА</span>
  <span class="lab d">СТРЕЛА</span>
  <span class="lab l">↺</span>
  <span class="lab r">↻</span>
  <div class="knob" id="kr"></div>
</div>

<div id="drive">
  <div id="dk"></div>
</div>

<div id="start">
  <button id="go">СТАРТ</button>
  <div>Завърти телефона хоризонтално</div>
</div>

<script>
(function(){

var c=document.getElementById('cv');
var x=c.getContext('2d');

var W,H,D;
var last=performance.now();
var run=0;

var M={
  bo:-0.45,
  ar:0.42,
  bu:0.22,
  load:0,
  tr:0,
  f:100,
  h:0,
  pos:0
};

var S={
  L:{x:0,y:0},
  R:{x:0,y:0},
  D:{x:0,y:0}
};

function rs(){
  D=Math.min(devicePixelRatio||1,2);
  W=innerWidth;
  H=innerHeight;

  c.width=W*D;
  c.height=H*D;

  x.setTransform(D,0,0,D,0,0);
}

addEventListener('resize',rs);
rs();

function bind(el,k,s,vertical){

  var id=null;

  function move(e){

    var r=el.getBoundingClientRect();

    var dx=vertical ? 0 : e.clientX-r.left-r.width/2;
    var dy=e.clientY-r.top-r.height/2;

    var max=38;
    var m=Math.hypot(dx,dy);

    if(m>max){
      dx*=max/m;
      dy*=max/m;
    }

    s.x=dx/max;
    s.y=dy/max;

    k.style.transform=
      'translate3d('+dx+'px,'+dy+'px,0)';

    k.classList.add('on');
  }

  function stop(){
    id=null;
    s.x=0;
    s.y=0;

    k.style.transform=
      'translate3d(0,0,0)';

    k.classList.remove('on');
  }

  el.onpointerdown=function(e){
    e.preventDefault();

    id=e.pointerId;

    try{
      el.setPointerCapture(id);
    }catch(err){}

    move(e);
  };

  el.onpointermove=function(e){
    if(e.pointerId===id){
      e.preventDefault();
      move(e);
    }
  };

  el.onpointerup=
  el.onpointercancel=function(e){
    if(e.pointerId===id){
      stop();
    }
  };
}

bind(jl,kl,S.L,false);
bind(jr,kr,S.R,false);
bind(drive,dk,S.D,true);

go.onclick=function(){
  document.body.classList.add('run');
  run=1;
};

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function update(dt){

  if(!run)return;

  M.ar=
    clamp(
      M.ar-S.L.y*1.2*dt,
      -1.1,
      1.2
    );

  M.bo=
    clamp(
      M.bo+S.R.y*1.0*dt,
      -1.2,
      0.2
    );

  M.bu=
    clamp(
      M.bu+S.R.x*1.5*dt,
      -1.3,
      1.2
    );

  M.pos=
    clamp(
      M.pos-S.D.y*80*dt,
      -W*0.18,
      W*0.18
    );

  M.h+=dt/60;

  M.f=Math.max(
    0,
    M.f-dt*0.025
  );

  if(
    S.R.x<-0.35 &&
    M.load<100
  ){
    M.load=
      Math.min(
        100,
        M.load+22*dt
      );
  }

  if(
    S.R.x>0.35 &&
    M.load>0
  ){

    var q=
      Math.min(
        M.load,
        25*dt
      );

    M.load-=q;

    M.tr=
      Math.min(
        100,
        M.tr+q
      );
  }

  if(M.tr>=100){
    M.tr=0;
  }
}

function draw(){

  x.clearRect(0,0,W,H);

  var sky=
    x.createLinearGradient(
      0,0,0,H
    );

  sky.addColorStop(
    0,
    '#72b5e0'
  );

  sky.addColorStop(
    0.68,
    '#dbe8e8'
  );

  sky.addColorStop(
    0.69,
    '#80684e'
  );

  sky.addColorStop(
    1,
    '#5d4937'
  );

  x.fillStyle=sky;
  x.fillRect(0,0,W,H);

  x.fillStyle='#5b4935';

  x.beginPath();
  x.moveTo(W*0.65,H*0.70);
  x.quadraticCurveTo(
    W*0.80,
    H*0.52,
    W*0.95,
    H*0.70
  );
  x.fill();

  x.save();
  x.translate(
    W*0.18,
    H*0.65
  );

  x.fillStyle='#b43b31';
  x.fillRect(
    -60,-40,
    55,40
  );

  x.fillStyle='#333d45';
  x.fillRect(
    0,-30,
    90,30
  );

  x.fillStyle='#151a1e';

  [-42,20,65].forEach(function(a){
    x.beginPath();
    x.arc(
      a,8,
      12,
      0,
      Math.PI*2
    );
    x.fill();
  });

  x.restore();

  var bx=
    W*0.52+
    M.pos;

  var by=
    H*0.64;

  var a=
    M.bo;

  var x1=
    bx+
    Math.cos(a)*130;

  var y1=
    by+
    Math.sin(a)*130;

  var a2=
    a+
    M.ar;

  var x2=
    x1+
    Math.cos(a2)*105;

  var y2=
    y1+
    Math.sin(a2)*105;

  x.fillStyle='#222a30';
  x.fillRect(
    bx-50,
    by+24,
    100,
    18
  );

  x.fillStyle='#e1a41e';
  x.fillRect(
    bx-42,
    by-14,
    84,
    40
  );

  x.fillStyle='#152028';
  x.fillRect(
    bx-34,
    by-47,
    40,
    34
  );

  x.strokeStyle='#e1a41e';
  x.lineCap='round';

  x.lineWidth=19;

  x.beginPath();
  x.moveTo(bx,by);
  x.lineTo(x1,y1);
  x.stroke();

  x.lineWidth=15;

  x.beginPath();
  x.moveTo(x1,y1);
  x.lineTo(x2,y2);
  x.stroke();

  x.save();

  x.translate(x2,y2);
  x.rotate(a2+M.bu);

  x.fillStyle='#c98d17';

  x.fillRect(
    0,-10,
    48,25
  );

  x.restore();

  hb.textContent=
    Math.round(M.load)+'%';

  ht.textContent=
    Math.round(M.tr)+'%';

  hh.textContent=
    M.h.toFixed(1);

  hf.textContent=
    Math.round(M.f)+'%';
}

function loop(now){

  var dt=
    Math.min(
      0.04,
      (now-last)/1000
    );

  last=now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

})();
</script>

</body>
</html>

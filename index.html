<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />

<title>Bager Simulator v1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#boot{position:fixed;inset:0;z-index:100;background:linear-gradient(#111820,#090d11);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px}
#boot h1{font-size:28px;margin:0;color:#ffc83d}
#boot p{font-size:13px;color:#b7c0c9;margin:0;max-width:340px;line-height:1.5}
#startBtn{margin-top:8px;border:0;border-radius:14px;padding:15px 28px;font-size:20px;font-weight:900;background:#ffc83d;color:#151515;box-shadow:0 8px 30px #0008}
.hide{display:none!important}
#hud{position:fixed;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:10;display:flex;gap:5px;pointer-events:none}
.card{flex:1;background:#0b1117cc;border:1px solid #ffffff2b;border-radius:9px;padding:5px 7px;backdrop-filter:blur(10px);min-width:0}
.card small{font-size:7px;color:#95a1ad;font-weight:800;letter-spacing:.08em}
.card b{display:block;margin-top:2px;color:#ffc83d;font:700 14px ui-monospace,Menlo,monospace;white-space:nowrap}
#mission{position:fixed;z-index:9;top:58px;left:50%;transform:translateX(-50%);background:#081017bf;border:1px solid #ffffff26;padding:7px 10px;border-radius:9px;font-size:10px;font-weight:800;white-space:nowrap;pointer-events:none}
.joy{position:fixed;z-index:20;bottom:max(12px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:#111922b5;border:2px solid #ffffff35;box-shadow:0 8px 28px #0009,inset 0 0 30px #0008;backdrop-filter:blur(8px)}
.joy.left{left:max(10px,env(safe-area-inset-left))}
.joy.right{right:max(10px,env(safe-area-inset-right))}
.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8290a0,#25303a 72%);border:2px solid #93a0ad;box-shadow:0 6px 16px #000a;transform:translate3d(0,0,0)}
.knob.on{background:radial-gradient(circle at 35% 30%,#ffe7a4,#df9714 72%);border-color:#ffc83d}
.label{position:absolute;font-size:8px;font-weight:900;color:#e5ebf0;text-shadow:0 1px 3px #000}
.up{top:6px;left:50%;transform:translateX(-50%)}
.down{bottom:6px;left:50%;transform:translateX(-50%)}
.lft{left:7px;top:50%;transform:translateY(-50%)}
.rgt{right:7px;top:50%;transform:translateY(-50%)}
#travel{position:fixed;z-index:20;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:72px;height:116px;background:#111922b5;border:2px solid #ffffff35;border-radius:12px;box-shadow:0 8px 28px #0009;backdrop-filter:blur(8px)}
#travelKnob{position:absolute;left:9px;top:44px;width:50px;height:26px;border-radius:6px;background:linear-gradient(#718090,#29343e);border:2px solid #8c99a6}
.tlbl{position:absolute;left:0;right:0;text-align:center;font-size:8px;font-weight:900;color:#e5ebf0}
.tf{top:7px}
.tb{bottom:7px}
#rpmBox{position:fixed;z-index:20;right:max(18px,env(safe-area-inset-right));bottom:166px;display:flex;align-items:center;gap:5px;background:#111922b5;border:1px solid #ffffff30;border-radius:9px;padding:5px 7px}
#rpmBox button{border:0;border-radius:7px;width:34px;height:32px;font-size:20px;font-weight:900;background:#2a3540;color:#fff}
#rpmVal{min-width:22px;text-align:center;color:#ffc83d;font:700 14px ui-monospace,monospace}
#cash{color:#4ade80!important}
@media (orientation:portrait){
  #boot:after{
    content:"Завърти телефона хоризонтално";
    margin-top:8px;
    color:#ffc83d;
    font-size:18px;
    font-weight:900
  }
}
</style>
</head>
<body>

<div id="game"></div>

<div id="boot">
  <h1>Bager Simulator v1</h1>
  <p>Мобилна 3D версия: багер, камион, копаене, товарене, гориво и мисия. Най-добре работи хоризонтално в Safari/Chrome.</p>
  <button id="startBtn">СТАРТ</button>
</div>

<div id="hud">
  <div class="card"><small>КОФА</small><b id="hBucket">0%</b></div>
  <div class="card"><small>КАМИОН</small><b id="hTruck">0%</b></div>
  <div class="card"><small>ГОРИВО</small><b id="hFuel">100%</b></div>
  <div class="card"><small>ПАРИ</small><b id="cash">€0</b></div>
</div>

<div id="mission">Мисия: натовари 3 камиона</div>

<div class="joy left" id="joyL">
  <span class="label up">РЪКОХ.</span>
  <span class="label down">НАВЪТРЕ</span>
  <span class="label lft">◀ ЗАВ.</span>
  <span class="label rgt">ЗАВ. ▶</span>
  <div class="knob" id="knobL"></div>
</div>

<div class="joy right" id="joyR">
  <span class="label up">СТРЕЛА ▼</span>
  <span class="label down">СТРЕЛА ▲</span>
  <span class="label lft">КОФА ↺</span>
  <span class="label rgt">ИЗСИП ↻</span>
  <div class="knob" id="knobR"></div>
</div>

<div id="travel">
  <span class="tlbl tf">НАПРЕД</span>
  <span class="tlbl tb">НАЗАД</span>
  <div id="travelKnob"></div>
</div>

<div id="rpmBox">
  <button id="rpmDown">−</button>
  <div id="rpmVal">7</div>
  <button id="rpmUp">+</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
(()=>{'use strict';

const $=id=>document.getElementById(id);

const H={
  bucket:$('hBucket'),
  truck:$('hTruck'),
  fuel:$('hFuel'),
  cash:$('cash'),
  mission:$('mission')
};

let renderer,scene,camera,clock;
let excavator,upper,boomPivot,armPivot,bucketPivot,bucketSoil;
let truck,truckSoil;
let terrain,terrainGeo,terrainPos;

let started=false;
let rpm=7;

const S={
  L:{x:0,y:0},
  R:{x:0,y:0},
  T:{x:0,y:0}
};

const M={
  boom:-0.38,
  arm:0.90,
  bucket:0.15,
  swing:0,
  z:-8,
  load:0,
  loadCap:1.0,
  fuel:100,
  money:0,
  trucks:0,
  missionTarget:3
};

const V={
  boom:0,
  arm:0,
  bucket:0,
  swing:0,
  travel:0
};

const terrainN=80;
const terrainSize=80;
const cell=terrainSize/terrainN;
const half=terrainSize/2;

const terrainH=new Float32Array((terrainN+1)*(terrainN+1));
const baseH=new Float32Array((terrainN+1)*(terrainN+1));

function idx(ix,iz){return iz*(terrainN+1)+ix}
function wx(ix){return -half+ix*cell}
function wz(iz){return -half+iz*cell}

function noise(x,z){
  return Math.sin(x*.09)*.22+
         Math.sin(z*.07)*.25+
         Math.sin((x+z)*.18)*.08
}

function mat(color,rough=.8,metal=.1){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal
  })
}

const MAT={
  yellow:mat(0xe2a21b,.55,.25),
  yellowDark:mat(0xb97c0c,.65,.3),
  dark:mat(0x222a30,.78,.35),
  rubber:mat(0x11161a,.95,.05),
  glass:new THREE.MeshStandardMaterial({
    color:0x83b7d1,
    transparent:true,
    opacity:.55,
    roughness:.15,
    metalness:.2
  }),
  soil:mat(0x5c4936,1,0),
  red:mat(0xb43b31,.5,.25),
  steel:mat(0x7e8891,.45,.7),
  green:mat(0x667b55,1,0)
};

function box(w,h,d,m){
  const o=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    m
  );
  o.castShadow=true;
  o.receiveShadow=true;
  return o;
}

function cyl(r,h,m,seg=18){
  const o=new THREE.Mesh(
    new THREE.CylinderGeometry(r,r,h,seg),
    m
  );
  o.castShadow=true;
  o.receiveShadow=true;
  return o;
}

function buildTerrain(){

  const v=[];
  const uv=[];
  const ind=[];

  for(let iz=0;iz<=terrainN;iz++){
    for(let ix=0;ix<=terrainN;ix++){

      const x=wx(ix);
      const z=wz(iz);
      const h=noise(x,z);

      terrainH[idx(ix,iz)]=h;
      baseH[idx(ix,iz)]=h;

      v.push(x,h,z);
      uv.push(ix/terrainN,iz/terrainN);
    }
  }

  for(let z=0;z<terrainN;z++){
    for(let x=0;x<terrainN;x++){

      const a=idx(x,z);
      const b=idx(x+1,z);
      const c=idx(x,z+1);
      const d=idx(x+1,z+1);

      ind.push(a,c,b,b,c,d);
    }
  }

  terrainGeo=new THREE.BufferGeometry();

  terrainGeo.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(v,3)
  );

  terrainGeo.setAttribute(
    'uv',
    new THREE.Float32BufferAttribute(uv,2)
  );

  terrainGeo.setIndex(ind);
  terrainGeo.computeVertexNormals();

  terrainPos=terrainGeo.attributes.position;

  terrain=new THREE.Mesh(
    terrainGeo,
    MAT.green
  );

  terrain.receiveShadow=true;
  scene.add(terrain);

  const road=box(
    16,
    .12,
    40,
    mat(0x735d45,1,0)
  );

  road.position.set(0,.04,0);

  scene.add(road);
}

function hAt(x,z){

  let fx=(x+half)/cell;
  let fz=(z+half)/cell;

  let ix=Math.max(
    0,
    Math.min(
      terrainN-1,
      Math.floor(fx)
    )
  );

  let iz=Math.max(
    0,
    Math.min(
      terrainN-1,
      Math.floor(fz)
    )
  );

  let tx=fx-ix;
  let tz=fz-iz;

  const a=terrainH[idx(ix,iz)];
  const b=terrainH[idx(ix+1,iz)];
  const c=terrainH[idx(ix,iz+1)];
  const d=terrainH[idx(ix+1,iz+1)];

  return (a*(1-tx)+b*tx)*(1-tz)+
         (c*(1-tx)+d*tx)*tz;
}

function deform(x,z,r,amt){

  let changed=false;

  const i0=Math.max(
    0,
    Math.floor((x-r+half)/cell)
  );

  const i1=Math.min(
    terrainN,
    Math.ceil((x+r+half)/cell)
  );

  const z0=Math.max(
    0,
    Math.floor((z-r+half)/cell)
  );

  const z1=Math.min(
    terrainN,
    Math.ceil((z+r+half)/cell)
  );

  for(let iz=z0;iz<=z1;iz++){

    for(let ix=i0;ix<=i1;ix++){

      const d=Math.hypot(
        wx(ix)-x,
        wz(iz)-z
      );

      if(d>r)continue;

      const k=1-d/r;
      const i=idx(ix,iz);

      terrainH[i]+=amt*k;

      terrainPos.setY(
        i,
        terrainH[i]
      );

      changed=true;
    }
  }

  if(changed){
    terrainPos.needsUpdate=true;
    terrainGeo.computeVertexNormals();
    terrainGeo.attributes.normal.needsUpdate=true;
  }
}

function buildExcavator(){

  excavator=new THREE.Group();
  scene.add(excavator);

  const base=new THREE.Group();
  excavator.add(base);

  [-1.25,1.25].forEach(s=>{

    const track=box(
      .75,.45,4.8,
      MAT.rubber
    );

    track.position.set(
      s,.4,0
    );

    base.add(track);

    for(let z=-2;z<=2;z+=.55){

      const p=box(
        .9,.12,.34,
        MAT.dark
      );

      p.position.set(
        s,.16,z
      );

      base.add(p);
    }
  });

  const turn=cyl(
    1.35,.35,
    MAT.dark,
    28
  );

  turn.position.y=.85;
  base.add(turn);

  upper=new THREE.Group();
  upper.position.y=1.05;
  base.add(upper);

  const body=box(
    2.7,1.15,3.6,
    MAT.yellow
  );

  body.position.set(
    .2,.7,-.55
  );

  upper.add(body);

  const counter=box(
    2.8,1.05,1.0,
    MAT.yellowDark
  );

  counter.position.set(
    .2,.65,-2.55
  );

  upper.add(counter);

  const cab=box(
    1.35,1.8,1.65,
    MAT.dark
  );

  cab.position.set(
    -1.05,1.55,.3
  );

  upper.add(cab);

  const win=box(
    1.05,1.2,.04,
    MAT.glass
  );

  win.position.set(
    -1.05,1.7,1.14
  );

  upper.add(win);

  boomPivot=new THREE.Group();

  boomPivot.position.set(
    .65,1.45,1.2
  );

  upper.add(boomPivot);

  const boom=box(
    .55,.55,5.0,
    MAT.yellow
  );

  boom.position.z=2.45;

  boomPivot.add(boom);

  armPivot=new THREE.Group();

  armPivot.position.z=4.9;

  boomPivot.add(armPivot);

  const arm=box(
    .42,.42,3.6,
    MAT.yellow
  );

  arm.position.z=1.75;

  armPivot.add(arm);

  bucketPivot=new THREE.Group();

  bucketPivot.position.z=3.45;

  armPivot.add(bucketPivot);

  const bucket=box(
    1.25,.8,1.0,
    MAT.yellowDark
  );

  bucket.position.set(
    0,-.35,.45
  );

  bucket.rotation.x=.18;

  bucketPivot.add(bucket);

  bucketSoil=new THREE.Mesh(
    new THREE.SphereGeometry(.52,16,10),
    MAT.soil
  );

  bucketSoil.scale.set(
    1,.5,1
  );

  bucketSoil.position.set(
    0,-.12,.45
  );

  bucketPivot.add(bucketSoil);
}

function buildTruck(){

  truck=new THREE.Group();
  scene.add(truck);

  const frame=box(
    2.3,.35,7.6,
    MAT.dark
  );

  frame.position.y=.75;

  truck.add(frame);

  const bed=box(
    2.7,1.15,4.6,
    MAT.steel
  );

  bed.position.set(
    0,1.45,-1.2
  );

  truck.add(bed);

  const cab=box(
    2.35,1.85,2.0,
    MAT.red
  );

  cab.position.set(
    0,1.7,2.5
  );

  truck.add(cab);

  const glass=box(
    1.9,.75,.05,
    MAT.glass
  );

  glass.position.set(
    0,2.05,3.51
  );

  truck.add(glass);

  [-1.2,1.2].forEach(x=>{
    [-2.4,0,2.5].forEach(z=>{

      const w=cyl(
        .5,.45,
        MAT.rubber,
        20
      );

      w.rotation.z=Math.PI/2;

      w.position.set(
        x,.45,z
      );

      truck.add(w);
    })
  });

  truckSoil=box(
    2.35,.75,4.1,
    MAT.soil
  );

  truckSoil.position.set(
    0,1.75,-1.2
  );

  truck.add(truckSoil);

  truck.position.set(
    -7,0,-8
  );
}

function init(){

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:'high-performance'
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  renderer.outputEncoding=
    THREE.sRGBEncoding;

  $('game').appendChild(
    renderer.domElement
  );

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x8fc7e8);

  scene.fog=
    new THREE.Fog(
      0x9fc9dd,
      28,
      90
    );

  camera=new THREE.PerspectiveCamera(
    68,
    innerWidth/innerHeight,
    .05,
    160
  );

  clock=new THREE.Clock();

  const hemi=
    new THREE.HemisphereLight(
      0xcbe7f8,
      0x5f533d,
      1.0
    );

  scene.add(hemi);

  const sun=
    new THREE.DirectionalLight(
      0xfff1d4,
      2.2
    );

  sun.position.set(
    -18,25,8
  );

  sun.castShadow=true;

  sun.shadow.mapSize.set(
    2048,2048
  );

  sun.shadow.camera.left=-25;
  sun.shadow.camera.right=25;
  sun.shadow.camera.top=25;
  sun.shadow.camera.bottom=-25;

  scene.add(sun);

  buildTerrain();
  buildExcavator();
  buildTruck();

  addEventListener(
    'resize',
    resize
  );

  resize();
  loop();
}

function resize(){

  if(!renderer)return;

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();
}

function bind(el,knob,state,vertical=false){

  let pid=null;

  function set(cx,cy){

    const r=
      el.getBoundingClientRect();

    let dx=
      vertical
      ?0
      :cx-r.left-r.width/2;

    let dy=
      cy-r.top-r.height/2;

    const max=40;

    const m=
      Math.hypot(dx,dy);

    if(m>max){
      dx*=max/m;
      dy*=max/m;
    }

    state.x=dx/max;
    state.y=dy/max;

    knob.style.transform=
      `translate3d(${dx}px,${dy}px,0)`;

    knob.classList.add('on');
  }

  function stop(){

    pid=null;

    state.x=0;
    state.y=0;

    knob.style.transform=
      'translate3d(0,0,0)';

    knob.classList.remove('on');
  }

  el.addEventListener(
    'pointerdown',
    e=>{

      e.preventDefault();

      pid=e.pointerId;

      try{
        el.setPointerCapture(pid)
      }catch(_){}

      set(
        e.clientX,
        e.clientY
      );
    }
  );

  el.addEventListener(
    'pointermove',
    e=>{

      if(e.pointerId===pid){

        e.preventDefault();

        set(
          e.clientX,
          e.clientY
        );
      }
    }
  );

  el.addEventListener(
    'pointerup',
    e=>{
      if(e.pointerId===pid)stop()
    }
  );

  el.addEventListener(
    'pointercancel',
    e=>{
      if(e.pointerId===pid)stop()
    }
  );
}

bind(
  $('joyL'),
  $('knobL'),
  S.L
);

bind(
  $('joyR'),
  $('knobR'),
  S.R
);

bind(
  $('travel'),
  $('travelKnob'),
  S.T,
  true
);

$('rpmUp').onclick=()=>{

  rpm=Math.min(
    10,
    rpm+1
  );

  $('rpmVal').textContent=rpm;
};

$('rpmDown').onclick=()=>{

  rpm=Math.max(
    1,
    rpm-1
  );

  $('rpmVal').textContent=rpm;
};

$('startBtn').onclick=()=>{

  if(!renderer)init();

  started=true;

  $('boot').classList.add(
    'hide'
  );

  if(
    document.documentElement.requestFullscreen
  ){
    document.documentElement
      .requestFullscreen()
      .catch(()=>{});
  }
};

function clamp(v,a,b){
  return Math.max(
    a,
    Math.min(b,v)
  )
}

function smooth(v,t,r,dt){
  return v+
    (t-v)*
    (1-Math.exp(-r*dt))
}

const tip=
  new THREE.Vector3();

function tipWorld(){

  tip.set(
    0,
    -.45,
    1.0
  );

  bucketPivot.localToWorld(
    tip
  );

  return tip;
}

function update(dt){

  if(!started)return;

  const power=
    M.fuel>0
    ?(.45+rpm*.075)
    :0;

  V.arm=smooth(
    V.arm,
    -S.L.y*1.25*power,
    6,
    dt
  );

  V.swing=smooth(
    V.swing,
    S.L.x*1.15*power,
    5,
    dt
  );

  V.boom=smooth(
    V.boom,
    S.R.y*1.0*power,
    6,
    dt
  );

  V.bucket=smooth(
    V.bucket,
    S.R.x*1.55*power,
    7,
    dt
  );

  V.travel=smooth(
    V.travel,
    -S.T.y*3.5*power,
    4,
    dt
  );

  M.arm=clamp(
    M.arm+V.arm*dt,
    .15,
    2.25
  );

  M.boom=clamp(
    M.boom+V.boom*dt,
    -.9,
    .55
  );

  M.bucket=clamp(
    M.bucket+V.bucket*dt,
    -1.1,
    1.65
  );

  M.swing+=V.swing*dt;

  M.z=clamp(
    M.z+V.travel*dt,
    -22,
    18
  );

  boomPivot.rotation.x=
    -M.boom;

  armPivot.rotation.x=
    M.arm;

  bucketPivot.rotation.x=
    M.bucket;

  upper.rotation.y=
    M.swing;

  excavator.position.set(
    0,
    hAt(0,M.z),
    M.z
  );

  const p=tipWorld();

  const gh=
    hAt(p.x,p.z);

  const digging=
    (
      S.R.x<-.18 ||
      S.L.y<-.2
    ) &&
    p.y<gh+.15 &&
    M.load<M.loadCap &&
    p.z>M.z+1.5;

  if(digging){

    const take=
      Math.min(
        .40*dt,
        M.loadCap-M.load
      );

    M.load+=take;

    deform(
      p.x,
      p.z,
      1.15,
      -.12*dt
    );
  }

  const dumping=
    S.R.x>.25 &&
    M.load>0;

  if(dumping){

    const over=
      Math.abs(
        p.x-truck.position.x
      )<1.8 &&
      Math.abs(
        p.z-(truck.position.z-1.2)
      )<2.8 &&
      p.y>2.2;

    const q=
      Math.min(
        .55*dt,
        M.load
      );

    M.load-=q;

    if(over){

      M.truckLoad=
        (M.truckLoad||0)+q;

      M.truckLoad=
        Math.min(
          1,
          M.truckLoad
        );

      if(M.truckLoad>=.995){

        M.trucks++;
        M.money+=250;
        M.truckLoad=0;

        H.mission.textContent=
          `Камиони ${M.trucks}/${M.missionTarget} · +€250`;

        truck.position.z=-28;

        setTimeout(
          ()=>H.mission.textContent=
          `Мисия: натовари ${M.missionTarget} камиона`,
          1200
        );
      }

    }else{

      deform(
        p.x,
        p.z,
        1.0,
        .09*dt
      );
    }
  }

  truck.position.z+=
    (
      M.truckLoad===0 &&
      truck.position.z<-8
    )
    ?7*dt
    :0;

  truck.position.y=
    hAt(
      truck.position.x,
      truck.position.z
    );

  M.fuel=
    Math.max(
      0,
      M.fuel-
      dt*(.008+.008*rpm)
    );

  bucketSoil.visible=
    M.load>.02;

  bucketSoil.scale.y=
    .2+
    .7*(M.load/M.loadCap);

  const tl=
    M.truckLoad||0;

  truckSoil.visible=
    tl>.01;

  truckSoil.scale.y=
    Math.max(
      .03,
      tl
    );

  truckSoil.position.y=
    1.4+
    .35*tl;

  if(
    M.trucks>=M.missionTarget
  ){
    H.mission.textContent=
      `Мисия завършена! Общо €${M.money}`;
  }
}

function cameraUpdate(){

  const pos=
    new THREE.Vector3(
      -.9,
      2.25,
      .45
    );

  upper.localToWorld(
    pos
  );

  camera.position.lerp(
    pos,
    .35
  );

  const target=
    new THREE.Vector3(
      .2,
      1.1,
      4.8
    );

  upper.localToWorld(
    target
  );

  camera.lookAt(
    target
  );
}

function hud(){

  H.bucket.textContent=
    Math.round(
      M.load/
      M.loadCap*
      100
    )+'%';

  H.truck.textContent=
    Math.round(
      (M.truckLoad||0)*
      100
    )+'%';

  H.fuel.textContent=
    Math.round(
      M.fuel
    )+'%';

  H.cash.textContent=
    '€'+M.money;
}

function loop(){

  requestAnimationFrame(
    loop
  );

  if(!renderer)return;

  const dt=
    Math.min(
      clock.getDelta(),
      .04
    );

  update(dt);
  cameraUpdate();
  hud();

  renderer.render(
    scene,
    camera
  );
}

})();
</script>

</body>
</html>

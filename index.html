<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>Империя 1453</title>
<style>
:root{
  --bg:#0f1720; --panel:#17212b; --panel2:#202d39; --gold:#d8b25c;
  --text:#f3f6f8; --muted:#aeb9c3; --good:#62c370; --bad:#e56b6f; --blue:#5aa9e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden
}
#app{
  height:100dvh;
  display:flex;
  flex-direction:column
}
header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  background:#101820;
  border-bottom:1px solid #2a3947
}
.brand{
  font-weight:800;
  color:var(--gold);
  letter-spacing:.5px
}
.resources{
  display:flex;
  gap:8px;
  font-size:12px;
  flex-wrap:wrap;
  justify-content:flex-end
}
.badge{
  background:#1f2c37;
  border:1px solid #344655;
  padding:5px 7px;
  border-radius:8px
}
#game{
  flex:1;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#243a4a,#152734)
}
#map{
  position:absolute;
  inset:0;
  touch-action:none
}
.city,.army{
  position:absolute;
  transform:translate(-50%,-50%);
  user-select:none
}
.city button,.army button{
  border:0;
  color:white;
  font-weight:700;
  box-shadow:0 4px 12px #0008
}
.city button{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#546e7a;
  border:3px solid #d7e0e6;
  font-size:11px
}
.city.ottoman button{background:#3d7d4e}
.city.byzz button{background:#6b4c9a}
.city.neutral button{background:#8a7045}
.army button{
  min-width:76px;
  padding:8px 9px;
  border-radius:12px;
  background:#264d32;
  border:2px solid #7ed38b;
  font-size:11px
}
.army.enemy button{
  background:#5a2a2c;
  border-color:#e28181
}
.label{
  margin-top:3px;
  font-size:11px;
  text-align:center;
  text-shadow:0 2px 3px #000
}
#bottom{
  height:185px;
  background:#101820;
  border-top:1px solid #2a3947;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px
}
.action{
  background:var(--panel2);
  color:var(--text);
  border:1px solid #405363;
  border-radius:12px;
  font-size:12px;
  font-weight:700;
  padding:8px 4px
}
.action:active{transform:scale(.97)}
.action.primary{
  background:#6b5220;
  border-color:#a7822f;
  color:#fff3cf
}
#panel{
  position:absolute;
  left:8px;
  right:8px;
  bottom:8px;
  background:#111b23f2;
  border:1px solid #3c4d5a;
  border-radius:14px;
  padding:10px;
  display:none;
  max-height:52%;
  overflow:auto;
  z-index:20
}
#panel h3{
  margin:0 0 8px;
  color:var(--gold)
}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  border-bottom:1px solid #263440;
  font-size:13px
}
.row:last-child{border-bottom:0}
.small{
  font-size:12px;
  color:var(--muted)
}
.btn{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#2c566d;
  color:white;
  font-weight:800
}
.btn.good{background:#2f6c42}
.btn.bad{background:#7b3336}
.btn.gold{background:#7c6128}
.close{
  float:right;
  background:#2b3945;
  color:white;
  border:0;
  border-radius:8px;
  padding:5px 9px
}
#toast{
  position:absolute;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  background:#111d25e8;
  border:1px solid #50606c;
  padding:9px 12px;
  border-radius:10px;
  display:none;
  z-index:30;
  font-size:13px
}
#turnBtn{
  position:absolute;
  right:10px;
  top:10px;
  z-index:10;
  border:0;
  border-radius:12px;
  background:#84671f;
  color:white;
  font-weight:800;
  padding:10px 13px
}
.road{
  position:absolute;
  height:4px;
  background:#b49b6a66;
  transform-origin:left center;
  border-radius:3px
}
.water{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 76% 40%,#3d6c86 0 11%,transparent 12%),
    radial-gradient(circle at 74% 55%,#3b718d 0 8%,transparent 9%),
    linear-gradient(120deg,#344e42 0 48%,#2e4655 48% 52%,#42573f 52% 100%);
  opacity:.95
}
.legend{
  position:absolute;
  left:10px;
  top:10px;
  z-index:9;
  font-size:11px;
  background:#0c141ac0;
  padding:7px;
  border-radius:8px
}
</style>
</head>

<body>
<div id="app">

<header>
  <div class="brand">⚔️ Империя 1453</div>

  <div class="resources">
    <span class="badge">💰 <b id="gold">12000</b></span>
    <span class="badge">🌾 <b id="food">9000</b></span>
    <span class="badge">👥 <b id="manpower">6500</b></span>
    <span class="badge">⭐ <b id="prestige">30</b></span>
  </div>
</header>

<div id="game">

  <div id="map">
    <div class="water"></div>

    <div class="legend">
      1453 • Османска държава<br>
      <span class="small">Докосни град или армия</span>
    </div>

    <button id="turnBtn">Следващ месец</button>
  </div>

  <div id="toast"></div>
  <div id="panel"></div>

</div>

<div id="bottom">

  <button class="action" onclick="openEmpire()">🏛 Държава</button>
  <button class="action" onclick="openEconomy()">💰 Икономика</button>
  <button class="action" onclick="openArmy()">⚔️ Армия</button>
  <button class="action" onclick="openRecruit()">🛡 Обучение</button>

  <button class="action" onclick="openGenerals()">🎖 Генерали</button>
  <button class="action" onclick="openDiplomacy()">🤝 Дипломация</button>
  <button class="action" onclick="openObjectives()">📜 Мисии</button>
  <button class="action primary" onclick="quickSiege()">🏰 Обсада</button>

</div>

</div>

<script>

const state = {

  month:1,
  year:1453,

  gold:12000,
  food:9000,
  manpower:6500,
  prestige:30,

  income:1800,
  expenses:1050,
  tax:12,

  stability:72,
  warSupport:68,

  selectedArmy:"A1",

  cities:[

    {
      id:"edirne",
      name:"Одрин",
      x:28,
      y:43,
      owner:"ottoman",
      pop:42000,
      fort:2,
      tax:650
    },

    {
      id:"bursa",
      name:"Бурса",
      x:25,
      y:72,
      owner:"ottoman",
      pop:55000,
      fort:2,
      tax:800
    },

    {
      id:"gallipoli",
      name:"Галиполи",
      x:42,
      y:60,
      owner:"ottoman",
      pop:18000,
      fort:1,
      tax:360
    },

    {
      id:"constantinople",
      name:"Константинопол",
      x:63,
      y:46,
      owner:"byzz",
      pop:70000,
      fort:5,
      tax:1300
    },

    {
      id:"silivri",
      name:"Силиври",
      x:52,
      y:42,
      owner:"byzz",
      pop:12000,
      fort:2,
      tax:250
    },

    {
      id:"nikomedia",
      name:"Никомедия",
      x:72,
      y:67,
      owner:"neutral",
      pop:22000,
      fort:2,
      tax:420
    }

  ],

  armies:[

    {
      id:"A1",
      name:"Армията на Мехмед",
      x:46,
      y:49,
      owner:"ottoman",
      inf:9000,
      cav:1800,
      art:68,
      morale:92,
      general:"Заганос паша",
      exp:12
    },

    {
      id:"A2",
      name:"Румелийски корпус",
      x:34,
      y:38,
      owner:"ottoman",
      inf:5200,
      cav:900,
      art:20,
      morale:84,
      general:"Халил паша",
      exp:8
    },

    {
      id:"E1",
      name:"Византийски гарнизон",
      x:64,
      y:47,
      owner:"enemy",
      inf:7200,
      cav:200,
      art:12,
      morale:88,
      general:"Джустиниани",
      exp:16
    }

  ],

  generals:[

    {
      name:"Заганос паша",
      skill:4,
      trait:"Агресивен",
      loyalty:85
    },

    {
      name:"Халил паша",
      skill:3,
      trait:"Организатор",
      loyalty:72
    },

    {
      name:"Шахабедин паша",
      skill:3,
      trait:"Обсаден експерт",
      loyalty:88
    }

  ],

  relations:{
    Venice:-25,
    Serbia:10,
    Genoa:-5,
    Hungary:-40
  },

  siege:0

};

const map = document.getElementById("map");
const panel = document.getElementById("panel");

function sync(){

  ["gold","food","manpower","prestige"].forEach(k=>{
    document.getElementById(k).textContent=Math.round(state[k]);
  });

  renderMap();

}

function renderMap(){

  [...map.querySelectorAll(".city,.army,.road")].forEach(e=>e.remove());

  const roads=[

    ["edirne","silivri"],
    ["silivri","constantinople"],
    ["gallipoli","constantinople"],
    ["bursa","nikomedia"]

  ];

  roads.forEach(([a,b])=>{

    const A=state.cities.find(c=>c.id===a);
    const B=state.cities.find(c=>c.id===b);

    const dx=B.x-A.x;
    const dy=B.y-A.y;

    const len=Math.hypot(dx,dy);

    const r=document.createElement("div");

    r.className="road";

    r.style.left=A.x+"%";
    r.style.top=A.y+"%";
    r.style.width=len+"%";

    r.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;

    map.appendChild(r);

  });

  state.cities.forEach(c=>{

    const d=document.createElement("div");

    d.className=`city ${c.owner}`;

    d.style.left=c.x+"%";
    d.style.top=c.y+"%";

    d.innerHTML=`

    <button>

    ${c.owner==="ottoman" ? "☪" : c.owner==="byzz" ? "✝" : "◆"}

    <br>

    ${c.fort}★

    </button>

    <div class="label">

    ${c.name}

    </div>

    `;

    d.onclick=()=>openCity(c.id);

    map.appendChild(d);

  });

  state.armies.forEach(a=>{

    const d=document.createElement("div");

    d.className=`army ${a.owner==="enemy"?"enemy":""}`;

    d.style.left=a.x+"%";
    d.style.top=a.y+"%";

    d.innerHTML=`

    <button>

    ${a.owner==="enemy" ? "🔴" : "🟢"}

    ${a.inf+a.cav}

    <br>

    ⚔ ${a.morale}%

    </button>

    <div class="label">

    ${a.name}

    </div>

    `;

    d.onclick=()=>openArmyUnit(a.id);

    map.appendChild(d);

  });

}

function show(html){

  panel.innerHTML=`

  <button class="close" onclick="closePanel()">✕</button>

  ${html}

  `;

  panel.style.display="block";

}

function closePanel(){

  panel.style.display="none";

}

function toast(t){

  const e=document.getElementById("toast");

  e.textContent=t;

  e.style.display="block";

  setTimeout(()=>{

    e.style.display="none";

  },1800);

}

function openCity(id){

  const c=state.cities.find(x=>x.id===id);

  show(`

  <h3>🏙 ${c.name}</h3>

  <div class="row">

  <span>Владетел</span>

  <b>

  ${c.owner==="ottoman"
  ? "Османци"
  : c.owner==="byzz"
  ? "Византия"
  : "Неутрален"}

  </b>

  </div>

  <div class="row">

  <span>Население</span>

  <b>${c.pop.toLocaleString()}</b>

  </div>

  <div class="row">

  <span>Крепост</span>

  <b>${c.fort}/5</b>

  </div>

  <div class="row">

  <span>Данък</span>

  <b>${c.tax} 💰/месец</b>

  </div>

  ${c.owner==="ottoman"

  ? `

  <button class="btn gold"

  onclick="upgradeFort('${id}')">

  Подобри крепостта — 900 💰

  </button>

  `

  :`

  <button class="btn bad"

  onclick="attackCity('${id}')">

  Атакувай града

  </button>

  `}

  `);

}

function upgradeFort(id){

  let c=state.cities.find(x=>x.id===id);

  if(state.gold<900){

    return toast("Нямаш достатъчно злато");

  }

  if(c.fort>=5){

    return toast("Крепостта е максимална");

  }

  state.gold-=900;

  c.fort++;

  toast("Крепостта е подобрена");

  sync();

  openCity(id);

}

function openEmpire(){

  show(`

  <h3>🏛 Османска държава</h3>

  <div class="row">

  <span>Султан</span>

  <b>Мехмед II</b>

  </div>

  <div class="row">

  <span>Дата</span>

  <b>${state.month}/${state.year}</b>

  </div>

  <div class="row">

  <span>Стабилност</span>

  <b>${state.stability}%</b>

  </div>

  <div class="row">

  <span>Подкрепа за войната</span>

  <b>${state.warSupport}%</b>

  </div>

  <div class="row">

  <span>Престиж</span>

  <b>${state.prestige}</b>

  </div>

  <div class="small">

  Цел: превземи Константинопол и укрепи империята.

  </div>

  `);

}

function openEconomy(){

  show(`

  <h3>💰 Икономика</h3>

  <div class="row">

  <span>Месечни приходи</span>

  <b>${state.income} 💰</b>

  </div>

  <div class="row">

  <span>Разходи</span>

  <b>${state.expenses} 💰</b>

  </div>

  <div class="row">

  <span>Нетно</span>

  <b>${state.income-state.expenses} 💰</b>

  </div>

  <div class="row">

  <span>Данъчна ставка</span>

  <b>${state.tax}%</b>

  </div>

  <button class="btn"

  onclick="changeTax(1)">

  Увеличи данъка +1%

  </button>

  <button class="btn"

  onclick="changeTax(-1)">

  Намали данъка -1%

  </button>

  `);

}

function changeTax(v){

  state.tax=Math.max(

    5,

    Math.min(25,state.tax+v)

  );

  state.income=

    1800+(state.tax-12)*80;

  state.stability=Math.max(

    0,

    Math.min(

      100,

      state.stability-v*2

    )

  );

  sync();

  openEconomy();

}

function openArmy(){

  const own=state.armies.filter(

    a=>a.owner==="ottoman"

  );

  show(`

  <h3>⚔️ Армия</h3>

  ${own.map(a=>`

  <div class="row">

  <span>

  ${a.name}

  <br>

  <span class="small">

  ${a.general}

  </span>

  </span>

  <b>

  ${a.inf+a.cav} души

  <br>

  ${a.art} оръдия

  </b>

  </div>

  `).join("")}

  <div class="small">

  Докосни армия на картата за подробности.

  </div>

  `);

}

function openArmyUnit(id){

  const a=state.armies.find(

    x=>x.id===id

  );

  if(a.owner==="ottoman"){

    state.selectedArmy=id;

  }

  show(`

  <h3>

  ${a.owner==="enemy" ? "🔴" : "🟢"}

  ${a.name}

  </h3>

  <div class="row">

  <span>Пехота</span>

  <b>${a.inf}</b>

  </div>

  <div class="row">

  <span>Кавалерия</span>

  <b>${a.cav}</b>

  </div>

  <div class="row">

  <span>Артилерия</span>

  <b>${a.art}</b>

  </div>

  <div class="row">

  <span>Морал</span>

  <b>${a.morale}%</b>

  </div>

  <div class="row">

  <span>Командир</span>

  <b>${a.general}</b>

  </div>

  ${a.owner==="ottoman"

  ?`

  <button class="btn good"

  onclick="moveSelected()">

  Придвижи към Константинопол

  </button>

  `

  :""

  }

  `);

}

function moveSelected(){

  let a=state.armies.find(

    x=>x.id===state.selectedArmy

  );

  a.x=58;

  a.y=50;

  toast("Армията се придвижи");

  sync();

  closePanel();

}

function openRecruit(){

  show(`

  <h3>🛡 Набиране и обучение</h3>

  <div class="small">

  Новите части се добавят към избраната армия.

  </div>

  <button class="btn good"

  onclick="recruit('inf')">

  +1000 пехота — 700 💰 / 1000 👥

  </button>

  <button class="btn good"

  onclick="recruit('cav')">

  +300 кавалерия — 900 💰 / 300 👥

  </button>

  <button class="btn good"

  onclick="recruit('art')">

  +10 оръдия — 1200 💰 / 150 👥

  </button>

  <button class="btn"

  onclick="trainArmy()">

  Общо обучение — 500 💰

  </button>

  `);

}

function recruit(type){

  let a=state.armies.find(

    x=>x.id===state.selectedArmy

  );

  const data={

    inf:[700,1000,1000],

    cav:[900,300,300],

    art:[1200,150,10]

  }[type];

  if(

    state.gold<data[0] ||

    state.manpower<data[1]

  ){

    return toast(

      "Недостатъчно ресурси"

    );

  }

  state.gold-=data[0];

  state.manpower-=data[1];

  a[type]+=data[2];

  a.morale=Math.max(

    65,

    a.morale-4

  );

  sync();

  toast("Частта е добавена");

}

function trainArmy(){

  let a=state.armies.find(

    x=>x.id===state.selectedArmy

  );

  if(state.gold<500){

    return toast(

      "Недостатъчно злато"

    );

  }

  state.gold-=500;

  a.morale=Math.min(

    100,

    a.morale+8

  );

  a.exp+=2;

  sync();

  toast("Армията е обучена");

}

function openGenerals(){

  show(`

  <h3>🎖 Генерали</h3>

  ${state.generals.map(g=>`

  <div class="row">

  <span>

  ${g.name}

  <br>

  <span class="small">

  ${g.trait}

  </span>

  </span>

  <b>

  Умение ${g.skill}/5

  <br>

  Лоялност ${g.loyalty}%

  </b>

  </div>

  `).join("")}

  `);

}

function openDiplomacy(){

  show(`

  <h3>🤝 Дипломация</h3>

  ${Object.entries(

    state.relations

  ).map(([n,r])=>`

  <div class="row">

  <span>${n}</span>

  <b>

  ${r>0 ? "+" : ""}${r}

  </b>

  </div>

  <button class="btn"

  onclick="improve('${n}')">

  Подобри отношения с ${n} — 300 💰

  </button>

  `).join("")}

  `);

}

function improve(n){

  if(state.gold<300){

    return toast(

      "Недостатъчно злато"

    );

  }

  state.gold-=300;

  state.relations[n]=Math.min(

    100,

    state.relations[n]+15

  );

  state.prestige+=1;

  sync();

  openDiplomacy();

}

function openObjectives(){

  const con=

    state.cities.find(

      c=>c.id==="constantinople"

    ).owner==="ottoman";

  const armySize=

    state.armies

    .filter(a=>a.owner==="ottoman")

    .reduce(

      (s,a)=>s+a.inf+a.cav,

      0

    );

  show(`

  <h3>📜 Мисии</h3>

  <div class="row">

  <span>

  Превземи Константинопол

  </span>

  <b>

  ${con ? "✅" : "❌"}

  </b>

  </div>

  <div class="row">

  <span>

  Армия над 15 000

  </span>

  <b>

  ${armySize>=15000 ? "✅" : "❌"}

  </b>

  </div>

  <div class="row">

  <span>

  Престиж 50

  </span>

  <b>

  ${state.prestige>=50 ? "✅" : "❌"}

  </b>

  </div>

  `);

}

function attackCity(id){

  if(id!=="constantinople"){

    return resolveBattle(id);

  }

  quickSiege();

}

function resolveBattle(id){

  let c=state.cities.find(

    x=>x.id===id

  );

  let a=state.armies.find(

    x=>x.id===state.selectedArmy

  );

  let power=

    a.inf+

    a.cav*1.6+

    a.art*35;

  let def=

    c.fort*3200+

    c.pop*.08;

  if(power>def*.8){

    c.owner="ottoman";

    state.prestige+=5;

    state.income+=c.tax;

    toast("Градът е превзет!");

  }else{

    a.inf=Math.max(

      500,

      a.inf-1200

    );

    a.morale-=15;

    toast(

      "Атаката е отблъсната"

    );

  }

  sync();

  closePanel();

}

function quickSiege(){

  const c=state.cities.find(

    x=>x.id==="constantinople"

  );

  if(c.owner==="ottoman"){

    return toast(

      "Константинопол вече е твой"

    );

  }

  let a=state.armies.find(

    x=>x.id===state.selectedArmy

  );

  if(a.art<30){

    return toast(

      "Трябват поне 30 оръдия"

    );

  }

  show(`

  <h3>

  🏰 Обсада на Константинопол

  </h3>

  <div class="row">

  <span>Напредък</span>

  <b>${state.siege}%</b>

  </div>

  <div class="row">

  <span>Твоя артилерия</span>

  <b>${a.art}</b>

  </div>

  <div class="row">

  <span>Крепост</span>

  <b>5/5</b>

  </div>

  <button class="btn bad"

  onclick="bombard()">

  Бомбардирай стените — 400 💰

  </button>

  <button class="btn gold"

  onclick="stormWalls()">

  Щурмувай стените

  </button>

  `);

}

function bombard(){

  let a=state.armies.find(

    x=>x.id===state.selectedArmy

  );

  if(state.gold<400){

    return toast(

      "Недостатъчно злато"

    );

  }

  state.gold-=400;

  let gain=Math.min(

    22,

    7+Math.floor(a.art/12)

  );

  state.siege=Math.min(

    100,

    state.siege+gain

  );

  a.morale=Math.max(

    55,

    a.morale-2

  );

  sync();

  quickSiege();

}

function stormWalls(){

  let a=state.armies.find(

    x=>x.id===state.selectedArmy

  );

  let chance=

    state.siege+

    a.morale*.35+

    a.art*.3+

    a.exp-

    55;

  if(

    Math.random()*100<chance

  ){

    const c=state.cities.find(

      x=>x.id==="constantinople"

    );

    c.owner="ottoman";

    state.prestige+=25;

    state.income+=c.tax;

    state.gold+=2500;

    state.siege=100;

    toast(

      "🏆 Константинопол е превзет!"

    );

  }else{

    a.inf=Math.max(

      1000,

      a.inf-

      Math.floor(

        900+Math.random()*1500

      )

    );

    a.cav=Math.max(

      100,

      a.cav-

      Math.floor(

        100+Math.random()*250

      )

    );

    a.morale=Math.max(

      35,

      a.morale-18

    );

    state.warSupport-=5;

    toast(

      "Щурмът се провали — имаш загуби"

    );

  }

  sync();

  closePanel();

}

function nextMonth(){

  state.month++;

  if(state.month>12){

    state.month=1;

    state.year++;

  }

  state.gold+=

    state.income-state.expenses;

  state.food-=Math.round(

    state.armies

    .filter(a=>a.owner==="ottoman")

    .reduce(

      (s,a)=>s+a.inf+a.cav,

      0

    )*.03

  );

  state.manpower+=180;

  if(state.food<0){

    state.food=0;

    state.stability-=3;

    state.armies

    .filter(a=>a.owner==="ottoman")

    .forEach(a=>{

      a.morale-=4;

    });

  }

  state.stability=Math.max(

    0,

    Math.min(

      100,

      state.stability

    )

  );

  state.armies

  .filter(a=>a.owner==="ottoman")

  .forEach(a=>{

    a.morale=Math.min(

      100,

      a.morale+2

    );

  });

  toast(

    `Месец ${state.month} • Хазна ${state.gold} 💰`

  );

  sync();

}

document.getElementById(
  "turnBtn"
).onclick=nextMonth;

sync();

</script>

</body>
</html>

<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Империя 1453 — Mobile Grand Strategy</title>
<style>
:root{
  --bg:#101417;--panel:#171d21;--panel2:#21292e;--line:#39444b;--text:#f4f1e8;
  --muted:#a9b1b5;--gold:#d0aa59;--ottoman:#3f6d4c;--byz:#694b7d;--serbia:#8b5e49;
  --hungary:#8a3c43;--venice:#9b823d;--water:#2f5668;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}
button{font:inherit}

#app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#0f1417
}

.topbar{
  height:58px;
  flex:0 0 58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:env(safe-area-inset-top) 10px 0;
  background:#12171a;
  border-bottom:1px solid #30383d;
  z-index:20
}

.title{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800
}

.title .crest{
  font-size:24px
}

.title small{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:600
}

.resources{
  display:flex;
  gap:6px;
  font-size:11px
}

.res{
  background:#20272b;
  border:1px solid #303a40;
  border-radius:8px;
  padding:5px 7px;
  white-space:nowrap
}

#world{
  position:relative;
  flex:1;
  overflow:hidden;
  background:#21363f
}

#mapWrap{
  position:absolute;
  inset:0;
  touch-action:none;
  transform-origin:center center
}

svg{
  width:100%;
  height:100%;
  display:block;
  background:linear-gradient(#294a5a,#23404c)
}

.sea-label{
  fill:#8fb1bd;
  font-size:21px;
  font-weight:700;
  opacity:.42;
  letter-spacing:2px
}

.province{
  stroke:#263136;
  stroke-width:2.1;
  transition:.15s;
  cursor:pointer
}

.province.selected{
  stroke:#f1d381;
  stroke-width:4;
  filter:brightness(1.15)
}

.ottoman{fill:var(--ottoman)}
.byz{fill:var(--byz)}
.serbia{fill:var(--serbia)}
.hungary{fill:var(--hungary)}
.venice{fill:var(--venice)}
.neutral{fill:#6f6b55}

.city-dot{
  fill:#e6d9ad;
  stroke:#302a20;
  stroke-width:2
}

.capital{
  fill:#f0c85f;
  stroke:#3b2c0e;
  stroke-width:3
}

.city-name{
  fill:#f4ead1;
  font-size:14px;
  font-weight:800;
  paint-order:stroke;
  stroke:#1c2327;
  stroke-width:3px
}

.country-name{
  fill:#e9e4d7;
  font-size:18px;
  font-weight:900;
  opacity:.35;
  letter-spacing:2px
}

.army-g{
  cursor:pointer
}

.army-shadow{
  fill:#000;
  opacity:.35
}

.army-box{
  fill:#152019;
  stroke:#83c58f;
  stroke-width:2.5
}

.army-box.enemy{
  fill:#301719;
  stroke:#d0747b
}

.army-txt{
  fill:#fff;
  font-size:11px;
  font-weight:900
}

.route{
  stroke:#f1ce68;
  stroke-width:4;
  stroke-dasharray:8 7;
  fill:none;
  opacity:.9
}

#hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  z-index:8;
  pointer-events:none
}

.dateBox,.speedBox{
  pointer-events:auto;
  background:#10171bcc;
  border:1px solid #445159;
  border-radius:10px;
  backdrop-filter:blur(8px)
}

.dateBox{
  padding:7px 9px;
  font-size:12px;
  font-weight:800
}

.speedBox{
  display:flex;
  overflow:hidden
}

.speedBox button{
  width:38px;
  height:36px;
  border:0;
  background:transparent;
  color:white;
  font-weight:900
}

.speedBox button.active{
  background:#7a642c;
  color:#fff0b8
}

#sidePanel{
  position:absolute;
  top:56px;
  right:8px;
  width:min(310px,80vw);
  max-height:63%;
  overflow:auto;
  z-index:12;
  background:#12191ded;
  border:1px solid #47545b;
  border-radius:14px;
  backdrop-filter:blur(12px);
  display:none;
  box-shadow:0 10px 30px #0008
}

.panelHead{
  padding:12px;
  border-bottom:1px solid #303c42;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.panelHead h3{
  margin:0;
  color:var(--gold);
  font-size:17px
}

.close{
  border:0;
  background:#273238;
  color:white;
  border-radius:8px;
  width:32px;
  height:32px
}

.panelBody{
  padding:10px
}

.stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 2px;
  border-bottom:1px solid #293238;
  font-size:13px
}

.stat span{
  color:var(--muted)
}

.bigBtn{
  width:100%;
  margin-top:8px;
  border:1px solid #4c5b63;
  border-radius:10px;
  padding:11px 10px;
  color:white;
  background:#26333a;
  font-weight:800
}

.bigBtn.gold{
  background:#745d25;
  border-color:#a78639
}

.bigBtn.green{
  background:#2d5d3a;
  border-color:#4d8f5c
}

.bigBtn.red{
  background:#6a3033;
  border-color:#a95055
}

.bigBtn:active{
  transform:scale(.985)
}

.bottom{
  height:92px;
  flex:0 0 92px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  background:#11171a;
  border-top:1px solid #323b40;
  z-index:30
}

.navBtn{
  border:1px solid #3c484e;
  border-radius:11px;
  background:#1c2428;
  color:#eef2f2;
  font-size:10px;
  font-weight:800;
  padding:5px 2px
}

.navBtn .ico{
  display:block;
  font-size:21px;
  margin-bottom:2px
}

.navBtn.active{
  background:#6e5722;
  border-color:#aa893c
}

#toast{
  position:absolute;
  left:50%;
  top:65px;
  transform:translateX(-50%);
  background:#0f171be8;
  border:1px solid #56656d;
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
  z-index:40;
  display:none;
  max-width:85%;
  text-align:center
}

#orders{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:11;
  display:none;
  background:#121a1ee8;
  border:1px solid #4e5c62;
  border-radius:12px;
  padding:7px;
  gap:6px
}

#orders button{
  border:0;
  border-radius:9px;
  padding:10px 12px;
  color:white;
  background:#2b373d;
  font-weight:800;
  font-size:12px
}

#orders .attack{
  background:#713338
}

#battleBanner{
  position:absolute;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  z-index:15;
  display:none;
  background:#151c20ef;
  border:1px solid #7b6a45;
  border-radius:15px;
  padding:12px;
  width:min(440px,88vw);
  text-align:center;
  box-shadow:0 12px 35px #000a
}

#battleBanner h2{
  margin:0 0 6px;
  color:#f1d07a;
  font-size:19px
}

.progress{
  height:8px;
  background:#273036;
  border-radius:6px;
  overflow:hidden;
  margin:8px 0
}

.progress>div{
  height:100%;
  background:#d4b05d;
  width:0%
}

.tutorial{
  position:absolute;
  left:10px;
  bottom:13px;
  z-index:6;
  background:#10181bc9;
  border:1px solid #405058;
  border-radius:10px;
  padding:8px 10px;
  font-size:11px;
  color:#dfe6e8;
  max-width:230px
}

@media (orientation:portrait){
  .bottom{
    height:100px;
    flex-basis:100px
  }

  .resources{
    gap:3px
  }

  .res{
    padding:4px 5px;
    font-size:10px
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="topbar">

    <div class="title">
      <div class="crest">☪️</div>
      <div>
        ИМПЕРИЯ 1453
        <small>Мехмед II • Османска държава</small>
      </div>
    </div>

    <div class="resources">
      <div class="res">💰 <b id="gold">12 000</b></div>
      <div class="res">👥 <b id="manpower">24 500</b></div>
      <div class="res">🌾 <b id="food">18 000</b></div>
    </div>

  </div>

  <div id="world">

    <div id="mapWrap">

      <svg id="map" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid slice">

        <rect width="1000" height="650" fill="#2f5668"/>

        <text x="650" y="525" class="sea-label">ЕГЕЙСКО МОРЕ</text>
        <text x="680" y="180" class="sea-label">ЧЕРНО МОРЕ</text>

        <path

        />

        <path

        />

        <path
          id="p-rumelia"
          class="province ottoman"

        />

        <path

        />

        <path

        />

        <path

          data-owner="Византия"
          d="M625,210 L715,205 L745,260 L690,270 Z"
        />

        <path
          id="p-venice"
          class="province venice"
          data-name="Венециански владения"
          data-owner="Венеция"
          d="M175,275 L305,260 L365,355 L315,455 L175,430 L120,345 Z"
        />

        <path
          id="p-bursa"
          class="province ottoman"
          data-name="Бурса"

          d="M690,270 L745,260 L850,295 L835,395 L700,410 L650,365 Z"
        />

        <path

        />

        <path

          data-owner="Неутрални бейлици"
          d="M650,365 L700,410 L835,395 L880,515 L715,600 L575,515 Z"
        />

        <text x="410" y="260" class="country-name">ОСМАНЦИ</text>
        <text x="670" y="242" class="country-name">ВИЗАНТИЯ</text>
        <text x="150" y="175" class="country-name">СЪРБИЯ</text>

        <path
          id="route1"

          d="M520,245 C570,245 620,245 675,245"
        />

        <circle class="city-dot capital" cx="515" cy="220" r="9"/>

        <circle class="city-dot" cx="755" cy="345" r="8"/>

        <circle class="city-dot capital" cx="690" cy="240" r="10"/>

          <rect

          <text
            class="army-txt"

            text-anchor="middle"

            ☪ МЕХМЕД II
          </text>

          <text
            class="army-txt"
            x="0"

            id="armyCount"

        <g id="armyByz" class="army-g" transform="translate(695,270)">

          <ellipse

          <rect

    </div>

    <div id="hud">

    <div id="toast"></div>

      </div>

      </div>

    </div>

  <div class="bottom">

    <button class="navBtn active" onclick="openRealm(this)">

      Армия
    </button>

      <span class="ico">💰</span>
      Икономика
    </button>

    <button class="navBtn" onclick="openDiplomacy(this)">
      <span class="ico">🤝</span>
      Дипломация
    </button>

    <button class="navBtn" onclick="openState(this)">
      <span class="ico">🏛️</span>
      Държава
    </button>

<script>

const state={
  gold:12000,
  manpower:24500,
  food:18000,

  day:1,
  month:4,
  year:1453,

  speed:0,

  selectedArmy:false,

  army:{
    x:565,
    y:260,
    men:18500,
    morale:91,
    artillery:72,
    training:78
  },

  enemy:{
    men:7200,
    morale:88
  },

  siege:0,

  constantinopleOwner:"Византия",

  income:1850,
  expenses:1120,

  stability:74,
  prestige:38,
  warSupport:82,

  timer:null
};

const monthNames=[
  "януари",
  "февруари",
  "март",
  "април",
  "май",
  "юни",
  "юли",
  "август",
  "септември",
  "октомври",
  "ноември",
  "декември"
];

const panel=document.getElementById("sidePanel");
const armyG=document.getElementById("armyMehmed");
const orders=document.getElementById("orders");

function fmt(n){
  return Math.round(n).toLocaleString("bg-BG");
}

function sync(){

  document.getElementById("gold").textContent=fmt(state.gold);

  document.getElementById("manpower").textContent=fmt(state.manpower);

  document.getElementById("food").textContent=fmt(state.food);

  document.getElementById("armyCount").textContent=fmt(state.army.men);

  document.getElementById("enemyCount").textContent=fmt(state.enemy.men);

  document.getElementById("date").textContent=
  `${state.day} ${monthNames[state.month-1]} ${state.year}`;

  armyG.setAttribute(
    "transform",
    `translate(${state.army.x},${state.army.y})`
  );

}

function toast(t){

  const e=document.getElementById("toast");

  e.textContent=t;

  e.style.display="block";

  clearTimeout(e._t);

  e._t=setTimeout(()=>{
    e.style.display="none";
  },1900);

}

function closePanel(){
  panel.style.display="none";
}

function showPanel(title,body){

  panel.innerHTML=`

  <div class="panelHead">

    <h3>${title}</h3>

    <button class="close" onclick="closePanel()">
      ✕
    </button>

  </div>

  <div class="panelBody">

    ${body}

  </div>

  `;

  panel.style.display="block";

}

function selectNav(btn){

  document.querySelectorAll(".navBtn").forEach(x=>{
    x.classList.remove("active");
  });

  btn.classList.add("active");

}

function setSpeed(s){

  state.speed=s;

  document.querySelectorAll(".speedBox button").forEach(b=>{
    b.classList.remove("active");
  });

  document.getElementById(
    s===0 ? "pauseBtn" : "s"+s
  ).classList.add("active");

  clearInterval(state.timer);

  if(s>0){

    state.timer=setInterval(
      tick,
      1100/s
    );

  }

}

function tick(){

  state.day++;

  state.food-=18;

  if(state.day>30){

    state.day=1;

    state.month++;

    state.gold+=state.income-state.expenses;

    state.manpower+=120;

  }

  if(state.month>12){

    state.month=1;

    state.year++;

  }

  if(state.food<0){

    state.food=0;

    state.stability=Math.max(
      0,
      state.stability-2
    );

    state.army.morale=Math.max(
      25,
      state.army.morale-3
    );

  }

  sync();

}

function openRealm(btn){

  selectNav(btn);

  closePanel();

  toast("Карта на Балканите и Анадола");

}

function openArmyMenu(btn){

  selectNav(btn);

  showPanel(
    "⚔️ Османска армия",
    `

    <div class="stat">
      <span>Главна армия</span>
      <b>${fmt(state.army.men)} души</b>
    </div>

    <div class="stat">
      <span>Морал</span>
      <b>${state.army.morale}%</b>
    </div>

    <div class="stat">
      <span>Артилерия</span>
      <b>${state.army.artillery} оръдия</b>
    </div>

    <div class="stat">
      <span>Обучение</span>
      <b>${state.army.training}%</b>
    </div>

    <div class="stat">
      <span>Командир</span>
      <b>Мехмед II</b>
    </div>

    <button
      class="bigBtn green"
      onclick="recruit()"
    >
      Набери +1 000 пехота — 800 💰
    </button>

    <button
      class="bigBtn"
      onclick="train()"
    >
      Обучение — 500 💰
    </button>

    `
  );

}

function openEconomy(btn){

  selectNav(btn);

  showPanel(
    "💰 Икономика",
    `

    <div class="stat">
      <span>Приходи</span>
      <b>${fmt(state.income)} 💰 / месец</b>
    </div>

    <div class="stat">
      <span>Разходи</span>
      <b>${fmt(state.expenses)} 💰 / месец</b>
    </div>

    <div class="stat">
      <span>Баланс</span>
      <b>${fmt(state.income-state.expenses)} 💰</b>
    </div>

    <div class="stat">
      <span>Храна</span>
      <b>${fmt(state.food)}</b>
    </div>

    <button
      class="bigBtn gold"
      onclick="invest()"
    >
      Инвестирай в търговия — 1 500 💰
    </button>

    `
  );

}

  showPanel(

    <div class="stat">

    </div>

      <span>Унгария</span>
      <b>-42</b>
    </div>

    <div class="stat">
      <span>Венеция</span>
      <b>-28</b>
    </div>

    <div class="stat">
      <span>Византия</span>
      <b style="color:#e87b7f">
        Война
      </b>
    </div>

    <button
      class="bigBtn"
      onclick="toast('Пратеник е изпратен във Венеция')"
    >
      Изпрати пратеник
    </button>

    `

}

function openState(btn){

  selectNav(btn);

  showPanel(
    "🏛️ Османска държава",
    `

    <div class="stat">
      <span>Султан</span>
      <b>Мехмед II</b>
    </div>

    <div class="stat">
      <span>Столица</span>

    </div>

      <span>Стабилност</span>
      <b>${state.stability}%</b>
    </div>

    <div class="stat">
      <span>Престиж</span>
      <b>${state.prestige}</b>
    </div>

    <div class="stat">
      <span>Подкрепа за войната</span>
      <b>${state.warSupport}%</b>
    </div>

    <button
      class="bigBtn gold"
      onclick="toast('Цел: превземи Константинопол')"
    >
      📜 Главна мисия
    </button>

    `
  );

}

function recruit(){

  if(
    state.gold<800 ||
    state.manpower<1000
  ){
    return toast(
      "Недостатъчно ресурси"
    );
  }

  state.gold-=800;

  state.manpower-=1000;

  state.army.men+=1000;

  state.army.morale=Math.max(
    65,
    state.army.morale-2
  );

  sync();

  openArmyMenu(
    document.querySelectorAll(".navBtn")[1]
  );

}

function train(){

  if(state.gold<500){

    return toast(
      "Нямаш достатъчно злато"
    );

  }

  state.gold-=500;

  state.army.training=Math.min(
    100,
    state.army.training+6
  );

  state.army.morale=Math.min(
    100,
    state.army.morale+5
  );

  sync();

  openArmyMenu(
    document.querySelectorAll(".navBtn")[1]
  );

}

function invest(){

  if(state.gold<1500){

    return toast(
      "Нямаш достатъчно злато"
    );

  }

  state.gold-=1500;

  state.income+=180;

  sync();

  toast(
    "Търговските приходи се увеличиха"
  );

}

armyG.addEventListener(
  "click",
  ()=>{

    state.selectedArmy=true;

    orders.style.display="flex";

    document.getElementById(
      "tutorial"
    ).style.display="none";

    showPanel(
      "⚔️ Армията на Мехмед",
      `

      <div class="stat">
        <span>Численост</span>
        <b>${fmt(state.army.men)}</b>
      </div>

      <div class="stat">
        <span>Морал</span>
        <b>${state.army.morale}%</b>
      </div>

      <div class="stat">
        <span>Артилерия</span>
        <b>${state.army.artillery}</b>
      </div>

      <div class="stat">
        <span>Позиция</span>
        <b>Тракия</b>
      </div>

      <button
        class="bigBtn green"
        onclick="moveToConstantinople()"

        Придвижи към Константинопол

);

document.getElementById(
  "armyByz"
).addEventListener(

document.querySelectorAll(
  ".province"
).forEach(
  p=>{

    p.addEventListener(

                "Константинопол"
              )
              ? "Град / крепост"
              : "Провинция"
            }
            </b>
          </div>

            ${
              o==="Османци"
              ? "82%"
              : "—"
            }
            </b>
          </div>

          `
        );

        e.stopPropagation();

      }
    );

  }
);

function moveToConstantinople(){

  closePanel();

  orders.style.display="none";

  document.getElementById(
    "route1"
  ).style.display="block";

  let sx=state.army.x;

  let sy=state.army.y;

  let tx=650;

  let ty=255;

  let start=performance.now();

  let dur=1400;

  function anim(now){

    let t=Math.min(
      1,
      (now-start)/dur
    );

    let e=
      t<.5
      ? 2*t*t
      : 1-Math.pow(
          -2*t+2,
          2
        )/2;

    state.army.x=
      sx+(tx-sx)*e;

    state.army.y=
      sy+(ty-sy)*e;

    sync();

    if(t<1){

      requestAnimationFrame(anim);

    }else{

      document.getElementById(
        "route1"
      ).style.display="none";

      toast(
        "Армията пристигна пред стените на Константинопол"
      );

    }

  }

  requestAnimationFrame(anim);

}

function startSiege(){

  if(state.army.x<620){

    toast(
      "Първо придвижи армията към Константинопол"
    );

    return;

  }

  closePanel();

  orders.style.display="none";

  setSpeed(0);

  const b=document.getElementById(
    "battleBanner"
  );

  const bar=document.getElementById(
    "battleProgress"
  );

  const txt=document.getElementById(
    "battleText"
  );

  b.style.display="block";

  let p=state.siege;

  const iv=setInterval(
    ()=>{

      p+=Math.max(
        3,
        Math.floor(
          state.army.artillery/20
        )
      );

      state.siege=Math.min(
        100,
        p
      );

      bar.style.width=
        state.siege+"%";

      if(state.siege<35){

        txt.textContent=
        "Големите оръдия разбиват външните стени...";

      }else if(state.siege<70){

        txt.textContent=
        "Защитниците отслабват. Пробивът се разширява...";

      }else if(state.siege<100){

        txt.textContent=
        "Еничарите се подготвят за решителен щурм...";

      }

      if(state.siege>=100){

        clearInterval(iv);

        setTimeout(
          resolveSiege,
          700
        );

      }

    },
    450
  );

}

function resolveSiege(){

  const b=document.getElementById(
    "battleBanner"
  );

  const byz=document.getElementById(
    "p-byz"
  );

  const power=
    state.army.men*
    (state.army.morale/100)+
    state.army.artillery*90;

  const defense=
    state.enemy.men*
    (state.enemy.morale/100)+
    5200;

  if(power>defense){

    const loss=Math.floor(
      1800+
      Math.random()*1100
    );

    state.army.men-=loss;

    state.enemy.men=0;

    state.gold+=3000;

    state.prestige+=25;

    state.constantinopleOwner=
      "Османци";

    byz.setAttribute(
      "class",
      "province ottoman selected"
    );

    byz.dataset.owner=
      "Османци";

    document.getElementById(
      "armyByz"
    ).style.display="none";

    document.querySelector(
      ".title small"
    ).textContent=
      "Мехмед II • Фатих";

    document.getElementById(
      "battleText"
    ).textContent=
      `🏆 Константинопол падна! Загуби: ${fmt(loss)} души`;

    toast(
      "🏆 КОНСТАНТИНОПОЛ Е ПРЕВЗЕТ!"
    );

  }else{

    const loss=Math.floor(
      3200+
      Math.random()*1800
    );

    state.army.men=Math.max(
      2000,
      state.army.men-loss
    );

    state.army.morale-=25;

    document.getElementById(
      "battleText"
    ).textContent=
      `Щурмът е отблъснат. Загуби: ${fmt(loss)} души`;

  }

  sync();

  setTimeout(
    ()=>{
      b.style.display="none";
    },
    3500
  );

}

sync();

</script>

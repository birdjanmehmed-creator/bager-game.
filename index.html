<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Султан 1453</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#101519;
  color:#eee;
  font-family:system-ui,-apple-system,sans-serif
}

button{
  color:#fff;
  font:inherit
}

.top{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 10px;
  background:#11191d;
  border-bottom:1px solid #3c454a
}

.logo{
  font-weight:900;
  color:#e1bd69
}

.res{
  display:flex;
  gap:5px;
  font-size:11px
}

.pill{
  padding:5px 7px;
  background:#222d32;
  border-radius:8px
}

#world{
  position:relative;
  height:calc(100dvh - 148px);
  overflow:hidden;
  background:#315769
}

#camera{
  position:absolute;
  width:1400px;
  height:900px;
  transform-origin:0 0;
  touch-action:none
}

svg{
  width:1400px;
  height:900px
}

.prov{
  stroke:#293438;
  stroke-width:3
}

.o{fill:#456f4e}
.b{fill:#70517d}
.s{fill:#80574b}
.h{fill:#873e45}
.v{fill:#988143}
.n{fill:#716c57}

.label{
  fill:#f4ead4;
  font-size:18px;
  font-weight:800;
  paint-order:stroke;
  stroke:#20272b;
  stroke-width:4
}

.country{
  fill:#fff;
  opacity:.25;
  font-size:29px;
  font-weight:900;
  letter-spacing:3px
}

.city{
  fill:#e6ca76;
  stroke:#30250e;
  stroke-width:3
}

.army{
  position:absolute;
  min-width:105px;
  padding:8px;
  border:2px solid #8fd39a;
  border-radius:10px;
  background:#17251bcc;
  text-align:center;
  font-size:11px;
  font-weight:900;
  box-shadow:0 5px 14px #0008
}

.army.enemy{
  border-color:#d97a80;
  background:#35191bcc
}

#panel{
  display:none;
  position:absolute;
  right:8px;
  top:8px;
  width:min(330px,85vw);
  max-height:75%;
  overflow:auto;
  background:#131b1fee;
  border:1px solid #526067;
  border-radius:14px;
  z-index:20
}

.ph{
  display:flex;
  justify-content:space-between;
  padding:11px;
  border-bottom:1px solid #344047
}

.ph b{
  color:#e1bd69
}

.close{
  border:0;
  border-radius:8px;
  background:#303b40;
  padding:5px 9px
}

.pb{
  padding:9px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 2px;
  border-bottom:1px solid #2d373c;
  font-size:13px
}

.row span{
  color:#abb6ba
}

.btn{
  width:100%;
  padding:10px;
  margin-top:7px;
  border:1px solid #53636b;
  border-radius:9px;
  background:#29383f;
  font-weight:800
}

.green{
  background:#315e3c
}

.red{
  background:#71343a
}

.gold{
  background:#745e29
}

.bottom{
  height:90px;
  padding:6px 7px calc(6px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
  background:#11191d;
  border-top:1px solid #3b454a
}

.nav{
  border:1px solid #3d494f;
  border-radius:9px;
  background:#202a2f;
  font-size:9px;
  font-weight:800
}

.nav i{
  font-style:normal;
  font-size:20px;
  display:block
}

#toast{
  display:none;
  position:absolute;
  z-index:50;
  top:65px;
  left:50%;
  transform:translateX(-50%);
  background:#10181bea;
  border:1px solid #5d6a70;
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
  text-align:center
}

#event{
  display:none;
  position:absolute;
  z-index:40;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(390px,90vw);
  background:#151d21;
  border:1px solid #756641;
  border-radius:15px;
  padding:13px;
  box-shadow:0 15px 45px #000c
}

#event h3{
  margin:0 0 7px;
  color:#e1bd69
}

.hint{
  position:absolute;
  left:8px;
  bottom:8px;
  background:#11191dcc;
  padding:7px 9px;
  border-radius:8px;
  font-size:10px;
  z-index:8
}
</style>
</head>

<body>

<div class="top">

  <div class="logo">
    ☪ СУЛТАН 1453
  </div>

  <div class="res">

    <div class="pill">
      💰 <b id="money">48 000</b>
    </div>

    <div class="pill">
      🌾 <b id="food">32 000</b>
    </div>

    <div class="pill">
      👥 <b id="mp">42 000</b>
    </div>

  </div>

</div>

<div id="world">

  <div id="camera">

    <svg viewBox="0 0 1400 900">

      <rect
        width="1400"
        height="900"
        fill="#315769"
      />

      <path
        class="prov h"
        d="M0 0H650L600 150 390 170 170 130 0 190Z"
      />

      <path
        class="prov s"
        d="M60 190L170 130 390 170 470 330 310 410 80 360Z"
      />

      <path
        class="prov o"
        d="M390 170L600 150 760 230 690 410 470 330Z"
      />

      <path
        class="prov o"
        d="M470 330L690 410 720 555 480 570 310 410Z"
      />

      <path
        class="prov v"
        d="M80 360L310 410 480 570 300 690 70 600Z"
      />

      <path
        id="constantinople"
        class="prov b"
        d="M690 410L805 390 855 455 720 490Z"
      />

      <path
        class="prov o"
        d="M720 490L855 455 1060 510 1020 670 800 650 720 555Z"
      />

      <path
        class="prov o"
        d="M1060 510L1400 430V720L1150 760 1020 670Z"
      />

      <path
        class="prov n"
        d="M800 650L1020 670 1150 760 940 900H650L630 770Z"
      />

      <text
        class="country"
        x="470"
        y="300"
      >
        ОСМАНСКА ИМПЕРИЯ
      </text>

      <text
        class="country"
        x="145"
        y="285"
      >
        СЪРБИЯ
      </text>

      <circle
        class="city"
        cx="650"
        cy="335"
        r="10"
      />

      <text
        class="label"
        x="666"
        y="330"
      >
        Одрин
      </text>

      <circle
        class="city"
        cx="790"
        cy="430"
        r="11"
      />

      <text
        class="label"
        x="810"
        y="425"
      >
        Константинопол
      </text>

      <circle
        class="city"
        cx="900"
        cy="570"
        r="9"
      />

      <text
        class="label"
        x="916"
        y="565"
      >
        Бурса
      </text>

      <circle
        class="city"
        cx="610"
        cy="515"
        r="8"
      />

      <text
        class="label"
        x="625"
        y="510"
      >
        Галиполи
      </text>

    </svg>

    <div
      id="army"
      class="army"
      style="left:670px;top:390px"
    >
      ☪ МЕХМЕД II
      <br>
      <span id="armyMen">22 000</span>
    </div>

    <div
      class="army enemy"
      style="left:800px;top:450px"
    >
      ✝ ГАРНИЗОН
      <br>
      7 500
    </div>

  </div>

  <div id="toast"></div>

  <div id="panel"></div>

  <div id="event"></div>

  <div class="hint">
    ☝️ Влачи картата • 🤏 zoom с два пръста
  </div>

</div>

<div class="bottom">

  <button
    class="nav"
    onclick="mapMenu()"
  >
    <i>🗺️</i>
    Карта
  </button>

  <button
    class="nav"
    onclick="armyMenu()"
  >
    <i>⚔️</i>
    Армия
  </button>

  <button
    class="nav"
    onclick="taxMenu()"
  >
    <i>💰</i>
    Данъци
  </button>

  <button
    class="nav"
    onclick="dipMenu()"
  >
    <i>🤝</i>
    Дипломация
  </button>

  <button
    class="nav"
    onclick="lawMenu()"
  >
    <i>📜</i>
    Закони
  </button>

  <button
    class="nav"
    onclick="pashaMenu()"
  >
    <i>👑</i>
    Паши
  </button>

</div>

<script>

const S={

  money:48000,

  food:32000,

  mp:42000,

  army:22000,

  jan:5000,

  azap:7000,

  sipahi:4000,

  akinji:3000,

  topcu:3000,

  taxRate:12,

  stability:78,

  prestige:45,

  law:"Умерени данъци",

  relations:{
    Сърбия:15,
    Унгария:-35,
    Венеция:-22,
    Византия:-100
  },

  provs:[

    {
      n:"Одрин",
      due:6200,
      paid:true,
      loy:88
    },

    {
      n:"Бурса",
      due:7400,
      paid:true,
      loy:84
    },

    {
      n:"Румелия",
      due:9100,
      paid:false,
      loy:58
    },

    {
      n:"Галиполи",
      due:3800,
      paid:true,
      loy:91
    }

  ],

  pashas:[

    {
      n:"Заганос паша",
      loy:92,
      corr:8,
      job:"Везир"
    },

    {
      n:"Халил паша",
      loy:61,
      corr:34,
      job:"Везир"
    },

    {
      n:"Иса паша",
      loy:74,
      corr:18,
      job:"Управител"
    }

  ]

};

const panel=
document.getElementById("panel");

const ev=
document.getElementById("event");

function f(n){

  return Math.round(n)
  .toLocaleString("bg-BG");

}

function sync(){

  money.textContent=
  f(S.money);

  food.textContent=
  f(S.food);

  mp.textContent=
  f(S.mp);

  armyMen.textContent=
  f(S.army);

}

function toast(t){

  let e=
  document.getElementById("toast");

  e.textContent=t;

  e.style.display="block";

  setTimeout(
    ()=>{
      e.style.display="none";
    },
    1800
  );

}

function show(t,b){

  panel.innerHTML=`

  <div class="ph">

    <b>${t}</b>

    <button
      class="close"
      onclick="panel.style.display='none'"
    >
      ✕
    </button>

  </div>

  <div class="pb">

    ${b}

  </div>

  `;

  panel.style.display="block";

}

function mapMenu(){

  panel.style.display="none";

  toast(
    "Свободна карта — влачи и приближавай"
  );

}

function armyMenu(){

  show(
    "⚔️ Армия на Мехмед",
    `

    <div class=row>
      <span>Еничари</span>
      <b>${f(S.jan)}</b>
    </div>

    <div class=row>
      <span>Азаби</span>
      <b>${f(S.azap)}</b>
    </div>

    <div class=row>
      <span>Сипахи</span>
      <b>${f(S.sipahi)}</b>
    </div>

    <div class=row>
      <span>Акънджии</span>
      <b>${f(S.akinji)}</b>
    </div>

    <div class=row>
      <span>Топчии</span>
      <b>${f(S.topcu)}</b>
    </div>

    <button
      class="btn green"
      onclick="recruit('jan',1000,1800)"
    >
      +1 000 еничари — 1 800
    </button>

    <button
      class="btn green"
      onclick="recruit('sipahi',500,1400)"
    >
      +500 сипахи — 1 400
    </button>

    <button
      class="btn green"
      onclick="recruit('akinji',500,800)"
    >
      +500 акънджии — 800
    </button>

    <button
      class="btn green"
      onclick="recruit('topcu',250,1600)"
    >
      +250 топчии — 1 600
    </button>

    `
  );

}

function recruit(k,num,cost){

  if(
    S.money<cost ||
    S.mp<num
  ){

    return toast(
      "Недостатъчно ресурси"
    );

  }

  S.money-=cost;

  S.mp-=num;

  S[k]+=num;

  S.army+=num;

  sync();

  armyMenu();

}

function taxMenu(){

  show(
    "💰 Данъци",

    S.provs.map(
      (p,i)=>`

      <div class=row>

        <span>
          ${p.n}
          <br>
          Лоялност ${p.loy}%
        </span>

        <b>
          ${f(p.due)} акчета
          <br>
          ${
            p.paid
            ? "✅ платен"
            : "❌ НЕ ПЛАЩА"
          }
        </b>

      </div>

      ${
        !p.paid
        ? `
        <button
          class="btn red"
          onclick="collect(${i})"
        >
          Изпрати събирачи
        </button>
        `
        : ""
      }

      `
    ).join("")

  );

}

function collect(i){

  let p=S.provs[i];

  if(Math.random()<.7){

    p.paid=true;

    S.money+=p.due;

    p.loy-=10;

    toast(
      "Данъкът е събран"
    );

  }else{

    p.loy-=18;

    S.stability-=3;

    toast(
      "Събирачите са прогонени — риск от бунт"
    );

  }

  sync();

  taxMenu();

}

function dipMenu(){

  show(
    "🤝 Дипломация",

    Object.entries(
      S.relations
    ).map(
      ([n,r])=>`

      <div class=row>

        <span>${n}</span>

        <b>${r}</b>

      </div>

      <button
        class="btn"
        onclick="improve('${n}')"
      >
        Подобри отношения — 500
      </button>

      `
    ).join("")

  );

}

function improve(n){

  if(S.money<500){

    return toast(
      "Нямаш пари"
    );

  }

  S.money-=500;

  S.relations[n]=
  Math.min(
    100,
    S.relations[n]+10
  );

  sync();

  dipMenu();

}

function lawMenu(){

  show(
    "📜 Закони",
    `

    <div class=row>
      <span>Текущ данъчен закон</span>
      <b>${S.law}</b>
    </div>

    <button
      class="btn"
      onclick="law('Ниски данъци',8,6)"
    >
      Ниски данъци
    </button>

    <button
      class="btn gold"
      onclick="law('Умерени данъци',12,0)"
    >
      Умерени данъци
    </button>

    <button
      class="btn red"
      onclick="law('Тежки данъци',18,-8)"
    >
      Тежки данъци
    </button>

    <div class=row>
      <span>Стабилност</span>
      <b>${S.stability}%</b>
    </div>

    `
  );

}

function law(n,r,stab){

  S.law=n;

  S.taxRate=r;

  S.stability=
  Math.max(
    0,
    Math.min(
      100,
      S.stability+stab
    )
  );

  S.provs.forEach(
    p=>{
      p.due=
      Math.round(
        p.due*(r/12)
      );
    }
  );

  toast(
    "Законът е променен"
  );

  lawMenu();

}

function pashaMenu(){

  show(
    "👑 Паши",

    S.pashas.map(
      (p,i)=>`

      <div class=row>

        <span>
          ${p.n}
          <br>
          ${p.job}
        </span>

        <b>
          Лоялност ${p.loy}%
          <br>
          Корупция ${p.corr}%
        </b>

      </div>

      <button
        class="btn"
        onclick="punish(${i},'warn')"
      >
        Предупреди
      </button>

      <button
        class="btn red"
        onclick="punish(${i},'fine')"
      >
        Глоби
      </button>

      <button
        class="btn red"
        onclick="punish(${i},'dismiss')"
      >
        Свали от длъжност
      </button>

      `
    ).join("")

  );

}

function punish(i,a){

  let p=
  S.pashas[i];

  if(a==="warn"){

    p.loy-=3;

    p.corr=
    Math.max(
      0,
      p.corr-5
    );

    toast(
      "Пашата е предупреден"
    );

  }

  if(a==="fine"){

    S.money+=1200;

    p.loy-=12;

    p.corr-=8;

    toast(
      "Имущество е конфискувано"
    );

  }

  if(a==="dismiss"){

    p.job=
    "Без длъжност";

    p.loy-=20;

    S.prestige+=2;

    toast(
      "Пашата е свален от длъжност"
    );

  }

  pashaMenu();

  sync();

}

document.getElementById(
  "army"
).onclick=armyMenu;



/* =========================
   ДВИЖЕНИЕ НА КАРТАТА
   ========================= */

const cam=
document.getElementById("camera");

const world=
document.getElementById("world");

let scale=.82;

let x=-220;

let y=-120;

let last=null;

let pinch=null;

let moved=false;

function apply(){

  cam.style.transform=
  `translate(${x}px,${y}px) scale(${scale})`;

}

function dist(a,b){

  return Math.hypot(
    a.clientX-b.clientX,
    a.clientY-b.clientY
  );

}

world.addEventListener(
  "touchstart",
  e=>{

    moved=false;

    if(e.touches.length===1){

      last={
        x:e.touches[0].clientX,
        y:e.touches[0].clientY
      };

    }else if(
      e.touches.length===2
    ){

      pinch={
        d:dist(
          e.touches[0],
          e.touches[1]
        ),
        s:scale
      };

      last=null;

    }

  },
  {
    passive:false
  }
);

world.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    moved=true;

    if(
      e.touches.length===1 &&
      last
    ){

      let t=e.touches[0];

      x+=t.clientX-last.x;

      y+=t.clientY-last.y;

      last={
        x:t.clientX,
        y:t.clientY
      };

      apply();

    }else if(
      e.touches.length===2 &&
      pinch
    ){

      scale=
      Math.max(
        .5,
        Math.min(
          2.3,
          pinch.s*
          dist(
            e.touches[0],
            e.touches[1]
          )/
          pinch.d
        )
      );

      apply();

    }

  },
  {
    passive:false
  }
);

world.addEventListener(
  "touchend",
  ()=>{

    last=null;

    pinch=null;

  }
);



/* =========================
   МИШКА ЗА КОМПЮТЪР
   ========================= */

let md=false;

let mx=0;

let my=0;

world.addEventListener(
  "mousedown",
  e=>{

    md=true;

    mx=e.clientX;

    my=e.clientY;

  }
);

window.addEventListener(
  "mousemove",
  e=>{

    if(!md)return;

    x+=e.clientX-mx;

    y+=e.clientY-my;

    mx=e.clientX;

    my=e.clientY;

    apply();

  }
);

window.addEventListener(
  "mouseup",
  ()=>{

    md=false;

  }
);

world.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    scale=
    Math.max(
      .5,
      Math.min(
        2.3,
        scale*
        (
          e.deltaY<0
          ? 1.1
          : .9
        )
      )
    );

    apply();

  },
  {
    passive:false
  }
);



apply();

sync();



/* =========================
   ПЪРВО СЪБИТИЕ
   ========================= */

setTimeout(
  ()=>{

    ev.innerHTML=`

    <h3>
      ⚠️ Румелия отказва да плати данъка
    </h3>

    <p style="font-size:13px">

      Дължими са
      <b>9 100 акчета</b>.

      Местните първенци искат отсрочка.

    </p>

    <button
      class="btn red"
      onclick="
        ev.style.display='none';
        taxMenu()
      "
    >
      Аз ще реша какво да правим
    </button>

    `;

    ev.style.display="block";

  },
  1300
);

</script>

</body>
</html>
